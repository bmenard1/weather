        function initYearBandHover() {
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) return;
            addRafMousemoveListener(document, (e) => {
                const container = document.getElementById('yearBandContainer');
                if (!container) return;
                const rect = container.getBoundingClientRect();
                // Show when hovering over the band area (with 20px above for easier targeting) or when map is active
                const hoverZoneTop = rect.top - 20;
                if (((e.clientY >= hoverZoneTop && e.clientY <= rect.bottom) || isWorldMapActive()) &&
                    getBoundedCacheEntry(yearBandCache, yearBandCacheOrder, currentCity)) {
                    showYearBand();
                } else if (container.classList.contains('visible') || container.style.pointerEvents === 'auto') {
                    if (!yearBandFadeTimeout && !yearBandCleanupTimeout) {
                        scheduleYearBandFadeOut();
                    }
                }
            });
            document.addEventListener('mouseleave', () => {
                const container = document.getElementById('yearBandContainer');
                if (container && (container.classList.contains('visible') || container.style.pointerEvents === 'auto')) {
                    if (!yearBandFadeTimeout && !yearBandCleanupTimeout) {
                        scheduleYearBandFadeOut();
                    }
                }
            });
        }

        // Initialize all visualizations (static, no animation)
        let timeMarkerFadeTimer = null;

        function updateTimeMarker() {
            const marker = document.getElementById('timeMarker');
            if (!marker) return;

            // Clear any pending fade
            if (timeMarkerFadeTimer) {
                clearTimeout(timeMarkerFadeTimer);
                timeMarkerFadeTimer = null;
            }

            if (currentDayOffset !== 0) {
                marker.classList.remove('visible');
                return;
            }

            const city = cities[currentCity];
            const now = new Date();
            const timeOpts = { hour12: false, hour: '2-digit', minute: '2-digit' };
            if (city.timezone && city.timezone !== 'auto') timeOpts.timeZone = city.timezone;
            const timeStr = now.toLocaleTimeString('en-US', timeOpts);
            const [hrs, mins] = timeStr.split(':').map(Number);
            const currentHour = hrs + mins / 60;
            const hourLabel = `<span class="hour-label">${hrs}:${String(mins).padStart(2, '0')}</span>`;

            const dspHours = displayEndHour - displayStartHour;
            const currentTimeT = (currentHour - displayStartHour) / dspHours;

            const ribbon = document.getElementById('skyRibbon');
            const ribbonWidth = ribbon.parentElement.offsetWidth;

            if (currentTimeT >= 0 && currentTimeT <= 1) {
                // Within range: downward triangle + hidden hour above ribbon
                const x = currentTimeT * ribbonWidth;
                marker.innerHTML = hourLabel + ' ▼';
                marker.style.top = '-18px';
                marker.style.left = x + 'px';
                marker.style.right = 'auto';
                marker.style.transform = 'translateX(-50%)';
                marker.style.color = 'rgba(255, 255, 255, 0.5)';
                marker.style.fontSize = '';
                // Start hour label hidden for in-range indicator
                const inLabel = marker.querySelector('.hour-label');
                if (inLabel) {
                    inLabel.style.transition = 'none';
                    inLabel.classList.add('faded');
                    requestAnimationFrame(() => { inLabel.style.transition = ''; });
                }
            } else if (currentTimeT < 0) {
                // Before range: left arrow + hour above ribbon
                marker.innerHTML = '<span class="arrow">◀</span>' + hourLabel;
                marker.style.top = '-20px';
                marker.style.left = '4px';
                marker.style.right = 'auto';
                marker.style.transform = 'none';
                marker.style.color = 'rgba(255, 255, 255, 0.3)';
                marker.style.fontSize = '';
            } else {
                // After range: hour + right arrow above ribbon
                marker.innerHTML = hourLabel + '<span class="arrow">▶</span>';
                marker.style.top = '-20px';
                marker.style.right = '4px';
                marker.style.left = 'auto';
                marker.style.transform = 'none';
                marker.style.color = 'rgba(255, 255, 255, 0.3)';
                marker.style.fontSize = '';
            }
            marker.classList.add('visible');

            // Schedule hour label fade-out after 10s (same as year band)
            timeMarkerFadeTimer = setTimeout(() => {
                timeMarkerFadeTimer = null;
                const label = marker.querySelector('.hour-label');
                if (label) label.classList.add('faded');
            }, 10000);
        }

        // Reveal hour label briefly on hover over time marker
        document.getElementById('timeMarker').addEventListener('mouseenter', () => {
            const marker = document.getElementById('timeMarker');
            const label = marker.querySelector('.hour-label');
            if (!label || !label.classList.contains('faded')) return; // already visible
            // Fast reveal
            label.style.transition = 'opacity 0.3s ease';
            label.classList.remove('faded');
            // Schedule re-fade after 3s
            if (timeMarkerFadeTimer) clearTimeout(timeMarkerFadeTimer);
            timeMarkerFadeTimer = setTimeout(() => {
                timeMarkerFadeTimer = null;
                label.style.transition = 'opacity 3s ease';
                label.classList.add('faded');
            }, 3000);
        });

        let drawScheduled = false;
        function draw() {
            // Batch multiple draw() calls into a single paint frame
            if (drawScheduled) return;
            drawScheduled = true;
            requestAnimationFrame(() => {
                drawScheduled = false;
                drawImmediate();
            });
        }
        function drawImmediate() {
            // Draw sky ribbon first so its dimensions are available for temperature curve positioning
            drawSkyRibbon();
            drawTemperatureCurve();
            drawYearBand();
            startWindAnimation();
            updateTimeMarker();
            updateOverlayPosition();
        }

        // Handle resize with debounce
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeTimer = null;
                draw();
                resizeWorldMap();
            }, 200);
        });

        // Fetch city suggestions from geocoding API
        async function fetchCitySuggestions(query) {
            if (query.length < 2) return [];
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`;
            try {
                const data = await fetchJsonWithRetry(url, { retries: 1, timeoutMs: 10000 });
                if (data.results && data.results.length > 0) {
                    return data.results.map(result => ({
                        name: result.name,
                        lat: result.latitude,
                        lon: result.longitude,
                        timezone: result.timezone,
                        country: result.country,
                        admin1: result.admin1 || ''
                    }));
                }
                return [];
            } catch (error) {
                console.error('Geocoding failed:', error);
                return [];
            }
        }

        // City label click handling
        let isEditingCity = false;
        let debounceTimer = null;
        let selectedSuggestion = null;

        function startCityEdit(e) {
            if (isEditingCity) return;
            isEditingCity = true;
            selectedSuggestion = null;

            // Get the current city label element (may have been recreated)
            const currentCityLabel = e ? e.currentTarget : document.getElementById('cityLabel');
            const currentName = currentCityLabel.textContent;

            // Create wrapper for input and suggestions
            const wrapper = document.createElement('div');
            wrapper.className = 'city-input-wrapper';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'city-input';
            input.value = '';
            input.placeholder = currentName;

            wrapper.appendChild(input);
            currentCityLabel.replaceWith(wrapper);
            input.focus();

            // Create suggestions container
            const suggestionsContainer = document.createElement('div');
            suggestionsContainer.className = 'city-suggestions';
            suggestionsContainer.style.display = 'none';
            wrapper.appendChild(suggestionsContainer);

            function showSuggestions(suggestions) {
                suggestionsContainer.innerHTML = '';
                if (suggestions.length === 0) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }

                suggestions.forEach(suggestion => {
                    const div = document.createElement('div');
                    div.className = 'city-suggestion';

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'city-suggestion-name';
                    nameSpan.textContent = suggestion.name;

                    const detailSpan = document.createElement('span');
                    detailSpan.className = 'city-suggestion-detail';
                    detailSpan.textContent = suggestion.admin1
                        ? `${suggestion.admin1}, ${suggestion.country}`
                        : suggestion.country;

                    div.appendChild(nameSpan);
                    div.appendChild(detailSpan);

                    div.addEventListener('mousedown', (e) => {
                        e.preventDefault(); // Prevent blur
                        selectCity(suggestion);
                    });

                    suggestionsContainer.appendChild(div);
                });

                suggestionsContainer.style.display = 'block';
            }

            async function selectCity(suggestion) {
                selectedSuggestion = suggestion;

                // Create a new city entry
                const cityKey = suggestion.name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();
                addOrUpdateCity(cityKey, {
                    name: suggestion.name,
                    lat: suggestion.lat,
                    lon: suggestion.lon,
                    timezone: suggestion.timezone
                });
                currentCity = cityKey;
                currentDayOffset = 0; // Reset to today's view when changing location

                // Restore label first
                restoreLabel(suggestion.name, false);
                await refreshView();
                // Show "set as default" option after refresh completes
                showSetDefaultButton();
                // Prefetch remaining days for new city
                prefetchRemainingDays(cityKey);
                // Show world map with animated dot transition
                showWorldMap(suggestion.lat, suggestion.lon);
            }

            function restoreLabel(name) {
                isEditingCity = false;
                if (debounceTimer) clearTimeout(debounceTimer);

                const newLabel = document.createElement('button');
                newLabel.type = 'button';
                newLabel.className = 'city-label';
                newLabel.id = 'cityLabel';
                newLabel.setAttribute('aria-label', 'Choose city');
                newLabel.textContent = name;
                wrapper.replaceWith(newLabel);
                newLabel.addEventListener('click', startCityEdit);
            }

            async function finishEdit() {
                if (selectedSuggestion) return; // Already handled by selectCity

                const newCityName = input.value.trim();

                if (newCityName) {
                    // Fetch suggestions and pick the first one
                    const suggestions = await fetchCitySuggestions(newCityName);
                    if (suggestions.length > 0) {
                        await selectCity(suggestions[0]);
                        return;
                    }
                }

                // No valid input or city not found, restore original
                restoreLabel(currentName);
            }

            // Debounced input handler for suggestions
            input.addEventListener('input', () => {
                if (debounceTimer) clearTimeout(debounceTimer);

                const query = input.value.trim();
                if (query.length < 2) {
                    suggestionsContainer.style.display = 'none';
                    return;
                }

                debounceTimer = setTimeout(async () => {
                    const suggestions = await fetchCitySuggestions(query);
                    showSuggestions(suggestions);
                }, 300);
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    suggestionsContainer.style.display = 'none';
                    finishEdit();
                } else if (e.key === 'Escape') {
                    if (debounceTimer) clearTimeout(debounceTimer);
                    restoreLabel(currentName);
                }
            });

            input.addEventListener('blur', () => {
                // Small delay to allow click on suggestion
                setTimeout(() => {
                    if (isEditingCity && !selectedSuggestion) {
                        finishEdit();
                    }
                }, 200);
            });
        }

        document.getElementById('cityLabel').addEventListener('click', (e) => {

        const auxButtonTimers = new WeakMap();
        function showAuxButton(btnEl, lingerMs = 2200) {
            if (!btnEl) return;
            const existingTimer = auxButtonTimers.get(btnEl);
            if (existingTimer) clearTimeout(existingTimer);
            btnEl.classList.add('shown');

        async function changeDayBy(delta) {
            if (delta === 0) return;

            if (delta < 0) {
                currentDayOffset--;
                await refreshView();
                if (currentDayOffset <= prefetchedPastBoundary + 3) {
                    prefetchPastDays(currentCity, prefetchedPastBoundary);
                }
                return;
            }

            if (currentDayOffset < maxFutureOffset) {
                currentDayOffset++;
                await refreshView();
                if (currentDayOffset >= maxFutureOffset) {
                    showForecastLimitMessage();
                }
            } else {
                showForecastLimitMessage();
            }
        }

        // Click on day label to go to today

        // Week view: show 5 stacked temperature curves
        let weekViewTimer = null;

        async function showWeekView() {
            // Cancel any existing timers
            if (weekViewTimer) { clearTimeout(weekViewTimer); weekViewTimer = null; }
            if (weekViewFadeTimer) { clearTimeout(weekViewFadeTimer); weekViewFadeTimer = null; }

            const canvas = document.getElementById('weekViewCanvas');
            const ctx = canvas.getContext('2d');
            const skyRibbonEl = document.getElementById('skyRibbon');
            const wrapper = document.getElementById('weatherDisplayWrapper');
            const skyRect = skyRibbonEl.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();

            // Position and size relative to the sky ribbon
            const ribbonLeft = skyRect.left - wrapperRect.left;
            const ribbonWidth = skyRect.width;
            const rowHeight = 36;
            const rowGap = 2;
            const numDays = 4; // Next 4 days (today is already shown)
            const padding = 8;
            const totalHeight = numDays * rowHeight + (numDays - 1) * rowGap + padding * 2;
            const labelWidth = 42;

            // Position canvas over the sky ribbon
            canvas.style.top = (skyRect.top - wrapperRect.top) + 'px';
            canvas.style.left = ribbonLeft + 'px';
            canvas.style.width = ribbonWidth + 'px';
            canvas.style.height = totalHeight + 'px';
            canvas.width = ribbonWidth * 2;
            canvas.height = totalHeight * 2;
            ctx.setTransform(2, 0, 0, 2, 0, 0);

            // Dark background with rounded corners
            ctx.fillStyle = 'rgba(13, 17, 23, 0.92)';
            ctx.beginPath();
            ctx.roundRect(0, 0, ribbonWidth, totalHeight, 20);
            ctx.fill();

            // Glow layers matching drawTemperatureCurve
            const glowLayers = [
                { width: 8, alpha: 0.08 },
                { width: 4, alpha: 0.18 },
                { width: 2, alpha: 0.85 },
                { width: 0.8, alpha: 0.5, highlight: true }
            ];

            // Fetch & draw each day (skip today, start at +1)
            const city = cities[currentCity];
            for (let i = 0; i < numDays; i++) {
                const offset = currentDayOffset + 1 + i;
                let dayData;
                try {
                    dayData = await fetchWeatherData(currentCity, offset);
                } catch (e) { break; }
                if (!dayData || !dayData.temperature) break;

                // Use the main display's time range so all curves share the same time axis
                const startHour = displayStartHour;
                const endHour = displayEndHour;
                const displayHours = endHour - startHour;

                const rowTop = padding + (numDays - 1 - i) * (rowHeight + rowGap);
                const curveBottom = rowTop + rowHeight - 4;
                const curveYRange = rowHeight - 8;
                const curveLeft = labelWidth;
                const curveWidth = ribbonWidth - labelWidth - 10;

                // Build curve data pixel-by-pixel with daylight brightness
                const fullTemp = dayData.temperature;
                const fullDaylight = dayData.daylight;
                const curveData = [];
                for (let x = 0; x <= curveWidth; x++) {
                    const t = x / curveWidth;
                    const hour = startHour + t * displayHours;

                    // Catmull-Rom for temperature
                    const idx1 = Math.min(23, Math.max(0, Math.floor(hour)));
                    const idx0 = Math.max(0, idx1 - 1);
                    const idx2 = Math.min(23, idx1 + 1);
                    const idx3 = Math.min(23, idx1 + 2);
                    const frac = hour - idx1;
                    const p0 = fullTemp[idx0], p1 = fullTemp[idx1], p2 = fullTemp[idx2], p3 = fullTemp[idx3];
                    const tt = frac * frac, ttt = tt * frac;
                    const tempValue = 0.5 * ((2 * p1) + (-p0 + p2) * frac + (2 * p0 - 5 * p1 + 4 * p2 - p3) * tt + (-p0 + 3 * p1 - 3 * p2 + p3) * ttt);

                    // Linear interpolation for daylight
                    const di = Math.min(23, Math.max(0, Math.floor(hour)));
                    const dFrac = hour - di;
                    const dayValue = fullDaylight[di] + (fullDaylight[Math.min(23, di + 1)] - fullDaylight[di]) * dFrac;
                    const brightness = getDaylightBrightness(dayValue);

                    const color = getTempColor(tempValue);
                    const y = curveBottom - (mapTempToDisplayRange(tempValue) * curveYRange);
                    curveData.push({ x: curveLeft + x, y, color, brightness, tempValue });
                }

                // Draw fill with brightness-aware gradient (matching main curve)
                curveData.forEach(d => {
                    const gradient = ctx.createLinearGradient(d.x, d.y, d.x, curveBottom);
                    for (let s = 0; s <= 8; s++) {
                        const gt = s / 8;
                        gradient.addColorStop(gt, colorToString(d.color, 0.35 * d.brightness * Math.pow(1 - gt, 2.5)));
                    }
                    ctx.fillStyle = gradient;
                    ctx.fillRect(d.x, d.y, 1.5, curveBottom - d.y);
                });

                // Draw glow layers with brightness-weighted width + dash pattern
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                glowLayers.forEach(layer => {
                    let dashOff = 0;
                    for (let j = 0; j < curveData.length - 1; j++) {
                        const d1 = curveData[j], d2 = curveData[j + 1];
                        const c = layer.highlight
                            ? { r: Math.min(255, d1.color.r + 40), g: Math.min(255, d1.color.g + 40), b: Math.min(255, d1.color.b + 40) }
                            : d1.color;

                        const widthScale = 0.4 + 0.6 * d1.brightness;
                        ctx.lineWidth = layer.width * widthScale;
                        ctx.strokeStyle = colorToString(c, layer.alpha * d1.brightness);

                        const dashPattern = getTempDashPattern(d1.tempValue);
                        if (dashPattern) {
                            const segLength = Math.sqrt(Math.pow(d2.x - d1.x, 2) + Math.pow(d2.y - d1.y, 2));
                            const [dashLen, gapLen] = dashPattern;
                            const posInCycle = dashOff % (dashLen + gapLen);
                            if (posInCycle < dashLen) {
                                ctx.setLineDash([]);
                                ctx.beginPath();
                                ctx.moveTo(d1.x, d1.y);
                                ctx.lineTo(d2.x, d2.y);
                                ctx.stroke();
                            }
                            dashOff += segLength;
                        } else {
                            ctx.setLineDash([]);
                            ctx.beginPath();
                            ctx.moveTo(d1.x, d1.y);
                            ctx.lineTo(d2.x, d2.y);
                            ctx.stroke();
                            dashOff = 0;
                        }
                    }
                });
                ctx.setLineDash([]);

                // Day label
                const dateStr = getDateForOffset(city, offset);
                const date = dateStringToUTCNoon(dateStr);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' });
                ctx.fillStyle = 'rgba(160, 170, 190, 0.5)';
                ctx.font = '11px system-ui, -apple-system, sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(dayName, 10, rowTop + rowHeight / 2);
            }

            // Show with fade-in
            canvas.classList.add('visible');

            // Auto-hide after 5 seconds
            weekViewTimer = setTimeout(() => {
                weekViewTimer = null;
                canvas.classList.remove('visible');
                weekViewFadeTimer = setTimeout(() => {
                    weekViewFadeTimer = null;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }, 800);
            }, 5000);
        }

        // Position the overlay to cover from below sky tooltip area down to temperature curve
        function updateOverlayPosition() {
            const wrapper = document.getElementById('weatherDisplayWrapper');
            const skyRibbonEl = document.getElementById('skyRibbon');
            const daySelectorEl = document.querySelector('.day-selector');
            const wrapperRect = wrapper.getBoundingClientRect();
            const skyRect = skyRibbonEl.getBoundingClientRect();
            const daySelectorRect = daySelectorEl.getBoundingClientRect();
            const height = wrapperRect.height || window.innerHeight * 0.6;

            // Calculate sky ribbon position relative to wrapper
            const skyBottomInWrapper = (skyRect.bottom - wrapperRect.top);

            // Get sky ribbon bounds relative to the wrapper
            const ribbonLeft = skyRect.left - wrapperRect.left;
            const ribbonWidth = skyRect.width;
            const skyTopInWrapper = skyRect.top - wrapperRect.top;

            // Sky tooltip stops at 144px from top of sky ribbon
            const visibleSkyHeight = 144;
            const tempOverlayTop = skyTopInWrapper + visibleSkyHeight;

            // Match the temperature curve positioning exactly as in drawTemperatureCurve()
            const curveHeight = Math.min(height * 0.396, 216);
            const curveBottom = skyBottomInWrapper + curveHeight * 0.8 - 160;

            // Stop overlay before the day selector (with 10px buffer)
            const daySelectorTopInWrapper = daySelectorRect.top - wrapperRect.top;
            const overlayBottom = Math.min(curveBottom + 20, daySelectorTopInWrapper - 10);

            // Ensure positive height, hide if invalid
            const overlayHeight = Math.max(0, overlayBottom - tempOverlayTop);

            tempOverlay.style.left = `${ribbonLeft}px`;
            tempOverlay.style.top = `${tempOverlayTop}px`;
            tempOverlay.style.width = `${ribbonWidth}px`;
            tempOverlay.style.height = `${overlayHeight}px`;
        }

        updateOverlayPosition();
        window.addEventListener('resize', updateOverlayPosition);

        // Track mouse movement direction for ref bar vs curve tooltip
        let prevMouseX = null, prevMouseY = null;
        let moveDirSmooth = 0; // -1 = horizontal, +1 = vertical, smoothed

        tempOverlay.addEventListener('mousemove', (e) => {
            // Get sky ribbon bounds in screen coordinates (for mouse position comparison)
            const skyRibbonEl = document.getElementById('skyRibbon');
            const wrapper = document.getElementById('weatherDisplayWrapper');
            const daySelectorEl = document.querySelector('.day-selector');
            const skyRect = skyRibbonEl.getBoundingClientRect();
            const wrapperRect = wrapper.getBoundingClientRect();
            const daySelectorRect = daySelectorEl.getBoundingClientRect();
            const ribbonLeft = skyRect.left;  // Screen coordinates for mouse comparison
            const ribbonWidth = skyRect.width;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            // Update movement direction (smoothed)
            if (prevMouseX !== null) {
                const dx = Math.abs(mouseX - prevMouseX);
                const dy = Math.abs(mouseY - prevMouseY);
                if (dx + dy > 1) { // ignore sub-pixel jitter
                    const dir = (dy > dx) ? 1 : -1; // +1 vertical, -1 horizontal
                    moveDirSmooth = moveDirSmooth * 0.7 + dir * 0.3; // exponential smoothing
                }
            }
            prevMouseX = mouseX;
            prevMouseY = mouseY;

            // Hide tooltip if mouse is at or below the day selector
            if (mouseY >= daySelectorRect.top - 10) {
                tempTooltip.style.display = 'none';
                return;
            }

            // Compute reference bar position (same as drawTemperatureCurve)
            const height = wrapperRect.height || window.innerHeight * 0.6;
            const skyBottomInWrapper = skyRect.bottom - wrapperRect.top;
            const curveHeight = Math.min(height * 0.396, 216);
            const curveBottom = skyBottomInWrapper + curveHeight * 0.8 - 160;
            const refLineXScreen = (skyRect.left + skyRect.right) / 2;
            const refLineTopScreen = wrapperRect.top + curveBottom - (1.0 * curveHeight * 0.8);
            const refLineBottomScreen = wrapperRect.top + curveBottom;

            // Check if mouse is near the reference bar (within 14px horizontally)
            const nearRefBar = Math.abs(mouseX - refLineXScreen) < 14
                && mouseY >= refLineTopScreen - 10
                && mouseY <= refLineBottomScreen + 10;

            // Reset direction memory when not near the bar
            if (!nearRefBar) moveDirSmooth = Math.min(moveDirSmooth, 0);

            if (nearRefBar && moveDirSmooth > 0) {
                // Primarily vertical movement on ref bar → show bar temperature
                const yFrac = Math.max(0, Math.min(1, (mouseY - refLineTopScreen) / (refLineBottomScreen - refLineTopScreen)));
                const tempNorm = tempDisplayMax - yFrac * (tempDisplayMax - tempDisplayMin);
                const tempCelsius = tempNorm * 60 - 25;
                const tempColor = getTempColor(tempNorm);
                const colorStr = `rgb(${Math.round(tempColor.r)}, ${Math.round(tempColor.g)}, ${Math.round(tempColor.b)})`;

                tempTooltip.style.background = 'none';
                tempTooltip.style.border = 'none';
                tempTooltip.style.boxShadow = 'none';
                tempTooltip.style.backdropFilter = 'none';
                tempTooltip.style.padding = '0';
                tempTooltip.style.transform = 'translateY(-50%)';
                tempTooltip.style.marginTop = '0';
                tempTooltip.innerHTML = `<span style="color: ${colorStr}; font-size: 0.8rem;">${displayTemp(tempCelsius)}${tempUnit()}</span>`;
                tempTooltip.style.left = `${mouseX + 14}px`;
                tempTooltip.style.top = `${mouseY}px`;
                tempTooltip.style.display = 'block';
                return;
            }

            // Calculate position along the ribbon (0 to 1)
            const t = (mouseX - ribbonLeft) / ribbonWidth;

            // Calculate hour from position (map t from display range to full 24h)
            const displayHours = displayEndHour - displayStartHour;
            const hour = Math.round(displayStartHour + t * displayHours);
            const hourStr = `${hour}h`;

            // Get temperature value using the same interpolation as the curve
            const tempNorm = interpolateDataSmooth(weatherData.temperature, t, true);

            // Convert normalized temperature back to Celsius
            // Normalization was: (temp + 25) / 60, so reverse: temp = norm * 60 - 25
            const tempCelsius = tempNorm * 60 - 25;

            // Get color for this temperature
            const tempColor = getTempColor(tempNorm);

            // Get wind data
            const windSpeedKmh = weatherData.windSpeedRaw ? interpolateData(weatherData.windSpeedRaw, t) : 0;

            // Build tooltip content
            let tempInfo = `<span style="color: rgb(${tempColor.r}, ${tempColor.g}, ${tempColor.b})">${displayTemp(tempCelsius)}${tempUnit()}</span>`;
            if (windSpeedKmh >= 20) {
                tempInfo += ` | ${Math.round(windSpeedKmh)} km/h wind`;
            }

            // Display the tooltip with hour on first line, temperature on second
            tempTooltip.style.background = '';
            tempTooltip.style.border = '';
            tempTooltip.style.boxShadow = '';
            tempTooltip.style.backdropFilter = '';
            tempTooltip.style.padding = '';
            tempTooltip.style.transform = '';
            tempTooltip.style.marginTop = '';
            tempTooltip.innerHTML = `<div class="tooltip-hour">${hourStr}</div><div class="tooltip-value">${tempInfo}</div>`;
            tempTooltip.style.left = `${mouseX}px`;
            tempTooltip.style.top = `${mouseY}px`;
            tempTooltip.style.display = 'block';
        });

                    // Cloudy - use daytime gray color (always bright, regardless of time of day)
                    const rainValue = interpolateData(weatherData.rain, t);
                    const baseGray = Math.round(230 - cloudValue * 30 - rainValue * 40);
                    cloudText = `${cloudPercent}% clouds`;
                    cloudColor = `rgb(${baseGray}, ${baseGray}, ${baseGray})`;
                }

                let weatherInfo = `<span style="color: ${cloudColor}">${cloudText}</span>`;

                // Add precipitation info if there's any rain or snow
                if (snowCm > 0.1) {
                    // Show snow in white
                    weatherInfo += ` | <span style="color: rgb(255, 255, 255)">${snowCm.toFixed(1)}cm snow</span>`;
                } else if (precipMm > 0.1) {
                    // Show rain in blue
                    weatherInfo += ` | <span style="color: rgb(100, 180, 235)">${precipMm.toFixed(1)}mm rain</span>`;
                }

                // Add sunrise/sunset info if within 1 hour
                const currentHour = displayStartHour + t * (displayEndHour - displayStartHour);
                const sunriseHour = weatherData.sunriseHour;
                const sunsetHour = weatherData.sunsetHour;

                if (Math.abs(currentHour - sunriseHour) <= 1) {
                    // Sample actual pixel color from sky ribbon at sunrise position
                    const sunriseT = (sunriseHour - displayStartHour) / (displayEndHour - displayStartHour);
                    const ribbonCanvas = document.getElementById('skyRibbon');
                    const ribbonCtx = ribbonCanvas.getContext('2d');
                    const sampleX = Math.floor(sunriseT * ribbonCanvas.width);
                    const sampleY = Math.floor(ribbonCanvas.height * 0.15);
                    const pixel = ribbonCtx.getImageData(sampleX, sampleY, 1, 1).data;
                    const sunriseMinutes = Math.round((sunriseHour % 1) * 60);
                    const sunriseTimeStr = `${Math.floor(sunriseHour)}h${sunriseMinutes.toString().padStart(2, '0')}`;
                    weatherInfo += ` | <span style="color: rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})">sunrise ${sunriseTimeStr}</span>`;
                } else if (Math.abs(currentHour - sunsetHour) <= 1) {
                    // Sample actual pixel color from sky ribbon at sunset position
                    const sunsetT = (sunsetHour - displayStartHour) / (displayEndHour - displayStartHour);
                    const ribbonCanvas = document.getElementById('skyRibbon');
                    const ribbonCtx = ribbonCanvas.getContext('2d');
                    const sampleX = Math.floor(sunsetT * ribbonCanvas.width);
                    const sampleY = Math.floor(ribbonCanvas.height * 0.15);
                    const pixel = ribbonCtx.getImageData(sampleX, sampleY, 1, 1).data;
                    const sunsetMinutes = Math.round((sunsetHour % 1) * 60);
                    const sunsetTimeStr = `${Math.floor(sunsetHour)}h${sunsetMinutes.toString().padStart(2, '0')}`;
                    weatherInfo += ` | <span style="color: rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})">sunset ${sunsetTimeStr}</span>`;
                }

                // Display the tooltip with hour on first line, weather info on second
                skyTooltip.innerHTML = `<div class="tooltip-hour">${hourStr}</div><div class="tooltip-value">${weatherInfo}</div>`;
                skyTooltip.style.left = `${mouseX}px`;
                skyTooltip.style.top = `${mouseY}px`;
                skyTooltip.style.display = 'block';
            });

            skyRibbon.addEventListener('mouseleave', () => {
                skyTooltip.style.display = 'none';
            });

            // Hover title: show "weather flow" when mouse is above the sky ribbon
            const hoverTitle = document.getElementById('hoverTitle');
            let hoverTitleFadeTimer = null;

            document.addEventListener('mousemove', (e) => {
                if (!hoverTitle) return;
                const ribbon = document.getElementById('skyRibbon');
                if (!ribbon) return;
                const ribbonRect = ribbon.getBoundingClientRect();
                const aboveRibbon = e.clientY < ribbonRect.top &&
                                    e.clientX >= ribbonRect.left &&
                                    e.clientX <= ribbonRect.right;

                if (aboveRibbon) {
                    if (hoverTitleFadeTimer) {
                        clearTimeout(hoverTitleFadeTimer);
                        hoverTitleFadeTimer = null;
                    }
                    if (!hoverTitle.classList.contains('visible')) {
                        const sub = document.getElementById('hoverSub');
                        if (sub) setSubtitleText(sub, randomSubtitle());
                    }
                    hoverTitle.classList.add('visible');
                } else {
                    if (hoverTitleFadeTimer) {
                        clearTimeout(hoverTitleFadeTimer);
                        hoverTitleFadeTimer = null;
                    }
                    hoverTitle.classList.remove('visible');
                }
            });
        }

        if (isTouchDevice) {
            document.body.classList.add('touch-device');

            // Show tap indicator briefly, then hide it
            const swipeIndicator = document.getElementById('swipeIndicator');
            setTimeout(() => {
                swipeIndicator.classList.add('hidden');
            }, 3000);

            const bindTouchInspector = (target, tooltipEl, buildHtml) => {
                if (!target) return;

                let touchStartX = 0;
                let touchStartY = 0;
                let trackingTouch = false;
                let swipeReady = false;

                target.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) return;
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    trackingTouch = true;
                    swipeReady = false;

                    const t = getRibbonTFromClientX(touch.clientX);
                    if (t !== null && weatherData.temperature?.length) {
                        showTouchTooltip(tooltipEl, buildHtml(t), touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                target.addEventListener('touchmove', (e) => {
                    if (!trackingTouch || e.touches.length !== 1) return;
                    const touch = e.touches[0];
                    const dx = touch.clientX - touchStartX;
                    const dy = touch.clientY - touchStartY;
                    const absX = Math.abs(dx);
                    const absY = Math.abs(dy);

                    if (absX > 52 && absX > absY * 1.35) {
                        swipeReady = true;
                        clearTouchTooltip(tooltipEl);
                        return;
                    }

                    if (absY <= 48 || absX >= absY) {
                        const t = getRibbonTFromClientX(touch.clientX);
                        if (t !== null && weatherData.temperature?.length) {
                            showTouchTooltip(tooltipEl, buildHtml(t), touch.clientX, touch.clientY);
                        }
                    }
                }, { passive: true });

                target.addEventListener('touchend', async (e) => {
                    if (!trackingTouch) return;
                    trackingTouch = false;

                    const touch = e.changedTouches[0];
                    const dx = touch.clientX - touchStartX;
                    const dy = touch.clientY - touchStartY;
                    const absX = Math.abs(dx);
                    const absY = Math.abs(dy);

                    if (swipeReady && absX > 72 && absX > absY * 1.2) {
                        clearTouchTooltip(tooltipEl);
                        await changeDayBy(dx < 0 ? 1 : -1);
                        return;
                    }

                    const t = getRibbonTFromClientX(touch.clientX);
                    if (t !== null && weatherData.temperature?.length) {
                        showTouchTooltip(tooltipEl, buildHtml(t), touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                target.addEventListener('touchcancel', () => {
                    trackingTouch = false;
                    swipeReady = false;
                    clearTouchTooltip(tooltipEl);
                }, { passive: true });
            };

            bindTouchInspector(skyRibbon, skyTooltip, buildSkyTooltipHtml);
            bindTouchInspector(tempOverlay, tempTooltip, buildTempTooltipHtml);
        } else {
            // Hide tap indicator on non-touch devices
            const swipeIndicator = document.getElementById('swipeIndicator');
            swipeIndicator.style.display = 'none';
        }

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => {
                console.log('Service worker registration failed:', err);
            });
        }

        // Initialize year band click/hover interaction
        initYearBandInteraction();
        initYearBandHover();

        // Subtitle list — embedded for reliability, can be overridden by subtitles.txt
        const subtitleList = [
            'forecast without numbers', 'a visual forecast', 'no numbers were harmed',
            'because your ex-weather app was ugly', 'humidity is not a personality',
            'no one reads the dewpoint', 'forecast, hold the spreadsheet',
            'weather without the maths', 'the sky, uninterrupted',
            'a day before it happens', 'sunrise to starlight',
            'zero percent chance of icons', 'finally, weather with taste',
            'the anti-dashboard', 'less data, more sky', 'uninterrupted by numbers',
            'many weather apps feel overwhelmed', 'chance of charts: zero',
            'no radar, no regrets', 'many weather app needs therapy',
            "the sun doesn't need a percentage", 'all sky, no sidebar',
            'weather for you, not for airplane pilots',
            'no one ever needed two decimal places',
            'twelve widgets was never the answer', 'wind chill is not a vibe',
            "your forecast doesn't need a legend", 'pollen count can wait',
            'weather, minus the anxiety', 'the barometer called, nobody answered',
            'seven-day forecast, zero digits', 'your ex-weather app peaked in 2005',
            'sponsored by: nobody', 'no push notifications',
            'the premium version is also free', 'no ads between you and the sky',
            'barometric pressure? seriously?'
        ];

        function randomSubtitle() {
            return subtitleList[Math.floor(Math.random() * subtitleList.length)];
        }

        function setSubtitleText(container, text) {
            if (!container) return;
            const span = document.createElement('span');
            span.textContent = text;
            container.replaceChildren(span);
        }

        // Also try loading from subtitles.txt (overrides embedded list if successful)
        fetchTextWithRetry('subtitles.txt', { retries: 0, timeoutMs: 5000 }).then(text => {
            const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            if (lines.length > 1) {
                subtitleList.length = 0;
                lines.forEach(l => subtitleList.push(l));
            }
        }).catch(() => {});

        // Set initial random subtitle on splash and hover
        (function initSubtitles() {
            const initSub = randomSubtitle();
            setSubtitleText(document.getElementById('splashSub'), initSub);
            setSubtitleText(document.getElementById('hoverSub'), initSub);
        })();

        // Fast initial load: show UI immediately, fetch only today, render, then background work
        updateCityLabel();
        updateDayLabel();

        (async () => {
            const splash = document.getElementById('splashTitle');
            try {
                // Single API call for today's data
                await updateWeatherData(currentCity, 0);

                // Calculate temp range from today's data (synchronous, no extra API call)
                calculateTempRangeFromData(fullWeatherData);
                tempRangeCity = currentCity;

                // Render (synchronous for initial layout)
                drawImmediate();

                // Show day selector now that layout is stable
                document.querySelector('.day-selector').classList.add('visible');
            } catch (e) {
                console.error('Initial load failed:', e);
                // Show day selector even on error
                document.querySelector('.day-selector').classList.add('visible');
            }

            // Fade out splash title (delay to keep visible longer)
            if (splash) {
                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.remove(), 1200);
                }, 2000);
            }

            // Background: refine temp range, year band, prefetch
            refineTempRangeInBackground(currentCity);
            yearBandCity = currentCity;
            fetchYearBandData(currentCity).then(() => drawYearBand());
            prefetchRemainingDays(currentCity);
        })();

        // Auto-refresh every hour to keep weather data current
        setInterval(() => {
            console.log('Auto-refreshing weather data...');
            currentDayOffset = 0; // Reset to current day
            refreshView();
        }, 60 * 60 * 1000); // 1 hour in milliseconds
    </script>
</body>
</html>
