<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Weather Flow</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Weather Flow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weather Flow">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="Beautiful weather visualization with flowing ribbons">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #0d1117 0%, #161b22 40%, #1a2332 70%, #0f1a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px;
            padding-top: 5vh;
            position: relative;
            /* Prevent horizontal scroll from swipe gestures */
            overflow-x: hidden;
        }

        /* Weather display wrapper - keeps sky and temperature together as one unit */
        .weather-display-wrapper {
            position: relative;
            width: 100%;
            z-index: 1;
            overflow: visible;
            /* Padding reduced since temp curve moved up 200px */
            padding-bottom: 50px;
        }

        #tempCurveCanvas, #windCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        #tempCurveCanvas { z-index: 0; }
        #windCanvas { z-index: 1; }
        #worldMapCanvas {
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 5s ease-in-out;
            cursor: crosshair;
        }
        #worldMapCanvas.visible {
            opacity: 1;
            transition: opacity 0.8s ease-out;
            pointer-events: auto;
        }

        #tempCurveOverlay {
            position: absolute;
            pointer-events: auto;
            z-index: 10;
        }

        /* Current time marker overlay on sky ribbon */
        .time-marker {
            position: absolute;
            pointer-events: auto;
            cursor: default;
            z-index: 101;
            font: 0.9rem system-ui, sans-serif;
            color: rgba(255, 255, 255, 0.35);
            white-space: nowrap;
            display: none;
        }
        .time-marker.visible { display: flex; align-items: center; gap: 4px; }
        .time-marker .arrow { font-size: 0.55rem; }
        .time-marker .hour-label { opacity: 1; transition: opacity 5s ease; }
        .time-marker .hour-label.faded { opacity: 0; }

        /* Tooltips - fixed on desktop for smooth tracking */
        .temp-tooltip, .sky-tooltip {
            position: fixed;
        }

        .touch-device #tempCurveOverlay {
            pointer-events: auto;
        }

        .touch-device #skyRibbon,
        .touch-device #tempCurveOverlay {
            touch-action: pan-y;
        }

        .touch-device .temp-tooltip,
        .touch-device .sky-tooltip {
            opacity: 0;
            transition: opacity 0.45s ease;
            margin-top: 0;
            z-index: 120;
        }

        .touch-device .temp-tooltip.touch-visible,
        .touch-device .sky-tooltip.touch-visible {
            opacity: 1;
        }


        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 2;
            /* Position the sky ribbon at the top of the wrapper */
            padding-top: 10px;
        }

        .ribbon-row {
            display: flex;
            align-items: flex-start;
            position: relative;
        }

        .ribbon-wrapper {
            flex: 1;
            height: 100px;
            position: relative;
            border-radius: 50px;
            overflow: hidden;
        }

        .ribbon-wrapper.dynamic-height {
            height: auto;
            min-height: 100px;
            border-radius: 50px 50px 0 0;
        }

        .ribbon-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .day-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 9px;
            left: 0;
            right: 0;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .day-selector.visible {
            opacity: 1;
        }

        .day-selector-content {
            position: relative;
            width: 100%;
            height: 44px;
        }

        .selector-divider {
            display: none;
        }

        .location-section {
            position: absolute;
            left: calc(39.6% - 60px);
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .city-label-wrapper {
            position: relative;
        }

        .random-btn {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: rgba(180, 190, 210, 0.7);
            font-size: 0.7rem;
            padding: 4px 10px;
            cursor: pointer;
            transition: opacity 0.8s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
            letter-spacing: 0.5px;
            opacity: 0;
            pointer-events: none;
        }
        .random-btn.shown {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }

        .random-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            color: #e8eaef;
        }

        .day-label-wrapper {
            position: relative;
            text-align: center;
        }

        .week-btn {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: rgba(180, 190, 210, 0.7);
            font-size: 0.7rem;
            padding: 4px 10px;
            cursor: pointer;
            transition: opacity 0.8s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
            letter-spacing: 0.5px;
            opacity: 0;
            pointer-events: none;
        }
        .week-btn.shown {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
        }
        .week-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            color: #e8eaef;
        }

        .unit-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: none;
            border: 1px solid transparent;
            border-radius: 12px;
            color: rgba(180, 190, 210, 0.5);
            font-size: 0.8rem;
            padding: 4px 10px;
            cursor: pointer;
            transition: opacity 0.3s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
            letter-spacing: 0.5px;
            opacity: 0;
        }
        .unit-btn.shown {
            opacity: 1;
        }
        .unit-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8eaef;
        }

        #weekViewCanvas {
            position: absolute;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        #weekViewCanvas.visible {
            opacity: 1;
        }

        .date-nav {
            position: absolute;
            left: calc(60.4% + 60px);
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .forecast-limit-msg {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 4px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            padding: 4px 12px;
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        .city-label, .day-label {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 15px;
            transition: all 0.25s ease;
            text-align: center;
            letter-spacing: 0.5px;
            background: none;
            border: 1px solid transparent;
            font: inherit;
            appearance: none;
            -webkit-appearance: none;
        }
        .city-label:hover, .day-label:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .city-label {
            color: rgba(235, 238, 245, 0.9);
            font-size: 0.9rem;
            min-width: 120px;
            position: relative;
        }
        .city-label:hover { color: #fff; }

        .set-default-btn {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 4px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 4px 12px;
            transition: all 0.25s ease;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
            white-space: nowrap;
            background: none;
            border: none;
            font: inherit;
        }
        .set-default-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        button:focus-visible,
        .city-label:focus-visible,
        .day-label:focus-visible,
        .set-default-btn:focus-visible,
        .city-input:focus-visible {
            outline: 2px solid rgba(190, 210, 245, 0.9);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        .city-input {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 6px 12px;
            outline: none;
            width: 150px;
        }

        .city-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .city-input-wrapper {
            position: relative;
            min-width: 120px;
            text-align: center;
        }

        .city-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: rgba(30, 40, 60, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .city-suggestion {
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .city-suggestion:last-child {
            border-bottom: none;
        }

        .city-suggestion:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .city-suggestion-name {
            color: #fff;
            font-size: 0.9rem;
        }

        .city-suggestion-detail {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            margin-left: 4px;
        }

        .day-arrow {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 28px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: none;
            color: rgba(180, 190, 210, 0.5);
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #prevDay { left: max(calc(50% + 45px), calc(60.4% - 60px)); }
        #nextDay { left: calc(60.4% + 180px); }

        .day-arrow:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8eaef;
        }

        .day-arrow:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .day-label {
            color: rgba(235, 238, 245, 0.9);
            font-size: 0.9rem;
            min-width: 140px;
            text-align: center;
            white-space: nowrap;
        }
        .day-label:hover { color: #fff; }

        /* Year temperature band */
        .year-band-container {
            width: 100%;
            max-width: 1200px;
            margin: 30px auto 0;
            height: 18px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 5s ease-in-out;
            pointer-events: none;
            position: relative;
            z-index: 5;
        }
        .year-band-container.visible {
            opacity: 1;
            transition: opacity 0.8s ease-out;
            pointer-events: auto;
        }
        #yearBandCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .year-band-tooltip {
            position: fixed;
            background: rgba(8, 12, 20, 0.85);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            pointer-events: none;
            z-index: 100;
            display: none;
            transform: translate(-50%, -100%);
            margin-top: -8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .temp-tooltip, .sky-tooltip {
            background: rgba(8, 12, 20, 0.85);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 100;
            display: none;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
            line-height: 1.4;
        }

        .tooltip-hour {
            font-size: 0.85rem;
            color: rgba(200, 210, 230, 0.8);
            margin-bottom: 2px;
        }

        .tooltip-value {
            font-size: 0.85rem;
        }

        /* Responsive styles for mobile */
        @media (max-width: 768px) {
            body {
                padding: 0 10px;
                padding-top: 3vh;
            }

            .container {
                padding-top: 5px;
            }

            .weather-display-wrapper {
                padding-bottom: 40px;
            }

            .day-selector {
                bottom: 9px;
            }

            .day-selector-content {
                gap: 12px;
            }

            .date-nav {
                gap: 6px;
            }

            .day-label {
                font-size: 0.8rem;
                min-width: 120px;
            }

            .city-label {
                font-size: 0.8rem;
                min-width: 80px;
            }

            .random-btn {
                font-size: 0.65rem;
                padding: 3px 8px;
            }

            .ribbon-wrapper {
                height: 80px;
            }

            .ribbon-wrapper.dynamic-height {
                min-height: 80px;
            }

            .year-band-container {
                height: 16px;
            }
        }

        /* Portrait smartphone layout */
        @media (max-width: 480px) and (orientation: portrait) {
            body {
                padding: 0 5px;
                padding-top: 2vh;
            }

            .container {
                padding-top: 5px;
            }

            .weather-display-wrapper {
                padding-bottom: 20px;
            }

            .day-selector {
                position: relative;
                bottom: auto;
                margin-top: 15px;
            }

            .day-selector-content {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                padding: 0 15px;
                gap: 10px;
            }

            .date-nav {
                gap: 4px;
            }

            .day-label {
                font-size: 0.8rem;
                min-width: auto;
                text-align: left;
            }

            .city-label {
                font-size: 0.8rem;
                min-width: auto;
                text-align: right;
            }

            .location-section {
                gap: 6px;
            }

            .random-btn {
                font-size: 0.6rem;
                padding: 3px 6px;
            }

            .selector-divider {
                display: none;
            }

            .year-band-container {
                height: 14px;
                margin: 4px 5px 0;
            }
        }

        /* Landscape smartphone - keep centered layout */
        @media (max-width: 480px) and (orientation: landscape) {
            body {
                padding: 0 10px;
                padding-top: 2vh;
            }

            .day-selector {
                bottom: 0px;
            }

            .day-selector-content {
                gap: 10px;
            }

            .date-nav {
                gap: 4px;
            }

            .day-label, .city-label {
                font-size: 0.75rem;
            }

            .day-label {
                min-width: 100px;
            }

            .random-btn {
                font-size: 0.6rem;
                padding: 2px 6px;
            }
        }

        /* Swipe indicator for touch devices */
        .swipe-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(180, 195, 220, 0.35);
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .swipe-indicator.hidden {
            opacity: 0;
        }

        /* Loading overlay for day/city navigation */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.visible {
            opacity: 1;
        }

        .loading-skeleton {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            height: 144px;
            border-radius: 50px 50px 0 0;
            background: linear-gradient(90deg,
                rgba(30, 40, 60, 0.6) 0%,
                rgba(50, 65, 90, 0.8) 50%,
                rgba(30, 40, 60, 0.6) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            overflow: hidden;
        }

        .loading-skeleton::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(255, 255, 255, 0.03) 50%,
                transparent 100%);
        }

        .loading-curve {
            position: absolute;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(90deg,
                rgba(80, 100, 140, 0.2) 0%,
                rgba(100, 130, 170, 0.4) 50%,
                rgba(80, 100, 140, 0.2) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            animation-delay: 0.2s;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Splash title shown on initial page load */
        .splash-title {
            position: absolute;
            top: -15px;
            left: 25%;
            right: 0;
            height: 160px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        .splash-title.hidden {
            opacity: 0;
        }

        .splash-inner {
            display: inline-block;
            position: relative;
        }

        .splash-title .splash-main {
            font-family: 'Avenir Next', 'Avenir', sans-serif;
            font-weight: 500;
            font-size: 3.2rem;
            color: rgb(30, 80, 160);
            letter-spacing: 0.12em;
            line-height: 1;
            white-space: nowrap;
            text-transform: lowercase;
        }

        .splash-title .splash-sub {
            font-family: 'Avenir Next', 'Avenir', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            color: rgb(20, 60, 135);
            margin-top: -2px;
            margin-left: 1rem;
            text-align: left;
        }

        @media (max-width: 480px) {
            .splash-title .splash-main {
                font-size: 2rem;
            }
            .splash-title .splash-sub {
                font-size: 0.5rem;
            }
        }

        /* Hover title - appears when mouse is above sky ribbon */
        .hover-title {
            position: absolute;
            top: -15px;
            left: 25%;
            right: 0;
            height: 160px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .hover-title.visible {
            opacity: 1;
        }

        .hover-title .hover-inner {
            display: inline-block;
            position: relative;
        }

        .hover-title .hover-main {
            font-family: 'Avenir Next', 'Avenir', sans-serif;
            font-weight: 500;
            font-size: 3.2rem;
            color: rgb(30, 80, 160);
            letter-spacing: 0.12em;
            line-height: 1;
            white-space: nowrap;
            text-transform: lowercase;
        }

        .hover-title .hover-sub {
            font-family: 'Avenir Next', 'Avenir', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            color: rgb(20, 60, 135);
            margin-top: -2px;
            margin-left: 1rem;
            text-align: left;
        }

        .touch-device .hover-title {
            display: none;
        }

        @media (max-width: 480px) {
            .hover-title .hover-main {
                font-size: 2rem;
            }
            .hover-title .hover-sub {
                font-size: 0.5rem;
            }
        }

        /* Subtitle slide animation */
        .splash-title .splash-sub,
        .hover-title .hover-sub {
            overflow: hidden;
            position: relative;
        }
        .splash-title .splash-sub span,
        .hover-title .hover-sub span {
            display: inline-block;
            transition: transform 1.2s ease-out, opacity 0.6s ease;
        }
        .splash-title .splash-sub span.slide-out,
        .hover-title .hover-sub span.slide-out {
            transform: translateX(-120%);
            opacity: 0;
            transition: transform 1.2s ease-in, opacity 0.8s ease;
        }
        .splash-title .splash-sub span.slide-in-from-right,

            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetchWithTimeout(url, { ...fetchOptions, signal, timeoutMs });
                    if (!response.ok) {
                        const err = new Error(`HTTP ${response.status} for ${url}`);
                        err.status = response.status;
                        throw err;
                    }
                    return await response.json();
                } catch (error) {
                    if (isAbortError(error)) throw error;
                    lastError = error;
                    const canRetry = attempt < retries &&
                        ((error.status && shouldRetryStatus(error.status)) || !error.status);
                    if (!canRetry) break;
                    await delay(250 * (attempt + 1));
                }
            }
            throw lastError || new Error(`Failed to fetch JSON: ${url}`);
        }

        async function fetchTextWithRetry(url, options = {}) {
            const {
                retries = DEFAULT_FETCH_RETRIES,
                timeoutMs = DEFAULT_FETCH_TIMEOUT_MS,
                signal,
                ...fetchOptions
            } = options;

            let lastError = null;
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetchWithTimeout(url, { ...fetchOptions, signal, timeoutMs });
                    if (!response.ok) {
                        const err = new Error(`HTTP ${response.status} for ${url}`);
                        err.status = response.status;
                        throw err;
                    }
                    return await response.text();
                } catch (error) {
                    if (isAbortError(error)) throw error;
                    lastError = error;
                    const canRetry = attempt < retries &&
                        ((error.status && shouldRetryStatus(error.status)) || !error.status);
                    if (!canRetry) break;
                    await delay(250 * (attempt + 1));
                }
            }
            throw lastError || new Error(`Failed to fetch text: ${url}`);
        }

        function addRafMousemoveListener(target, handler) {
            let rafId = null;
            let lastEvent = null;
            target.addEventListener('mousemove', (e) => {
                lastEvent = e;
                if (rafId !== null) return;
                rafId = requestAnimationFrame(() => {
                    rafId = null;
                    if (lastEvent) handler(lastEvent);
                });
            });
        }

        const BUILTIN_CITY_KEYS = new Set(Object.keys(cities));
        let dynamicCityKeys = [];

        function cleanupCachesForCity(cityKey) {
            removeBoundedCacheEntry(yearBandCache, yearBandCacheOrder, cityKey);
            Object.keys(weatherCache).forEach(cacheKey => {
                if (cacheKey.startsWith(`${cityKey}-`)) {
                    removeBoundedCacheEntry(weatherCache, weatherCacheOrder, cacheKey);
                }
            });
        }

        function pruneDynamicCities() {
            while (dynamicCityKeys.length > MAX_DYNAMIC_CITIES) {
                const evictIdx = dynamicCityKeys.findIndex(k => k !== currentCity);
                if (evictIdx === -1) break;
                const [evictKey] = dynamicCityKeys.splice(evictIdx, 1);
                delete cities[evictKey];
                cleanupCachesForCity(evictKey);
            }
        }

        function addOrUpdateCity(cityKey, cityData) {
            cities[cityKey] = cityData;
            if (!BUILTIN_CITY_KEYS.has(cityKey)) {
                touchOrder(dynamicCityKeys, cityKey);
                pruneDynamicCities();
            }
        }

        // ── World Map Overlay ──────────────────────────────────────────
        let worldMapPolygons = null; // Cached decoded polygons
        let mapFadeTimeout = null;
        let mapClearTimeout = null;
        let currentMapBounds = null; // Stored for click-to-coordinate conversion
        let currentMapLat = null;    // Last displayed dot latitude
        let currentMapLon = null;    // Last displayed dot longitude
        let currentExtraDots = null; // Array of {lat, lon, color} for similar cities

        // Heatmap overlay state
        let heatmapGridCache = {};     // dateStr → 2D array [row][col] of tempC
        const heatmapGridCacheOrder = [];
        let currentHeatmapGrid = null; // currently loaded grid data
        let heatmapFadeTimeout = null; // 3s delay before fade starts
        let heatmapFadeAnimId = null;  // RAF id for fade animation

        // Fade out heatmap over ~1 second, leaving only outlines + city dot
        function startHeatmapFade(canvas) {
            if (heatmapFadeAnimId) { cancelAnimationFrame(heatmapFadeAnimId); heatmapFadeAnimId = null; }
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const duration = 1000;
            const startTime = performance.now();
            function frame(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                const alpha = 1 - t; // 1 → 0
                ctx.setTransform(2, 0, 0, 2, 0, 0);
                ctx.clearRect(0, 0, rect.width, rect.height);
                drawWorldMap(ctx, worldMapPolygons, currentMapLat, currentMapLon, currentMapBounds, currentExtraDots, currentHeatmapGrid, alpha);
                if (t < 1) {
                    heatmapFadeAnimId = requestAnimationFrame(frame);
                } else {
                    heatmapFadeAnimId = null;
                }
            }
            heatmapFadeAnimId = requestAnimationFrame(frame);
        }

        function cancelHeatmapFade() {
            if (heatmapFadeTimeout) { clearTimeout(heatmapFadeTimeout); heatmapFadeTimeout = null; }
            if (heatmapFadeAnimId) { cancelAnimationFrame(heatmapFadeAnimId); heatmapFadeAnimId = null; }
        }

        function scheduleHeatmapFade(canvas) {
            cancelHeatmapFade();
            heatmapFadeTimeout = setTimeout(() => {
                heatmapFadeTimeout = null;
                startHeatmapFade(canvas);
            }, 3000);
        }
        const HEATMAP_LAT_MIN = -60, HEATMAP_LAT_MAX = 80;
        const HEATMAP_LON_MIN = -180, HEATMAP_LON_MAX = 170;
        const HEATMAP_STEP = 10;
        const HEATMAP_ROWS = 15; // (80 - (-60)) / 10 + 1
        const HEATMAP_COLS = 36; // (170 - (-180)) / 10 + 1

        // Fetch temperature grid for heatmap overlay
        async function fetchHeatmapGrid(dateStr) {
            const cachedGrid = getBoundedCacheEntry(heatmapGridCache, heatmapGridCacheOrder, dateStr);
            if (cachedGrid) return cachedGrid;

            // Generate grid points
            const gridPoints = [];
            for (let row = 0; row < HEATMAP_ROWS; row++) {
                for (let col = 0; col < HEATMAP_COLS; col++) {
                    gridPoints.push({
                        lat: HEATMAP_LAT_MIN + row * HEATMAP_STEP,
                        lon: HEATMAP_LON_MIN + col * HEATMAP_STEP,
                        row, col
                    });
                }
            }

            // Choose API based on date
            const todayDateStr = formatDateInTimeZone(new Date(), USER_TIME_ZONE);
            const diffDays = diffDateStrings(dateStr, todayDateStr);
            const isHistorical = diffDays < -5;
            const baseUrl = isHistorical
                ? 'https://archive-api.open-meteo.com/v1/archive'
                : 'https://api.open-meteo.com/v1/forecast';

            // Batch into groups of 50
            const batchSize = 50;
            const batches = [];
            for (let i = 0; i < gridPoints.length; i += batchSize) {
                batches.push(gridPoints.slice(i, i + batchSize));
            }

            // Initialize result grid
            const grid = [];
            for (let r = 0; r < HEATMAP_ROWS; r++) {
                grid.push(new Array(HEATMAP_COLS).fill(null));
            }

            // Fetch all batches in parallel
            const batchResults = await Promise.allSettled(batches.map(async (batch) => {
                const lats = batch.map(p => p.lat).join(',');
                const lons = batch.map(p => p.lon).join(',');
                const url = `${baseUrl}?latitude=${lats}&longitude=${lons}&hourly=temperature_2m,is_day&start_date=${dateStr}&end_date=${dateStr}&timezone=auto`;
                const json = await fetchJsonWithRetry(url, { retries: 1, timeoutMs: 15000 });
                return { batch, json };
            }));

            batchResults.forEach(result => {
                if (result.status === 'fulfilled') {
                    const { batch, json } = result.value;
                    const items = Array.isArray(json) ? json : [json];
                    items.forEach((item, idx) => {
                        const pt = batch[idx];
                        if (item.hourly && item.hourly.temperature_2m && item.hourly.is_day) {
                            let s = 0, c = 0;
                            for (let h = 0; h < item.hourly.temperature_2m.length; h++) {
                                if (item.hourly.is_day[h]) {
                                    s += item.hourly.temperature_2m[h];
                                    c++;
                                }
                            }
                            if (c > 0) {
                                grid[pt.row][pt.col] = s / c;
                            } else {
                                // All hours are night (polar), use overall mean
                                const temps = item.hourly.temperature_2m.filter(t => t !== null);
                                if (temps.length > 0) {
                                    grid[pt.row][pt.col] = temps.reduce((a, b) => a + b, 0) / temps.length;
                                }
                            }
                        }
                    });
                }
            });

            setBoundedCacheEntry(heatmapGridCache, heatmapGridCacheOrder, dateStr, grid, MAX_HEATMAP_CACHE_ENTRIES);
            return grid;
        }

        // Fetch and decode TopoJSON country data (110m simplified from Natural Earth)
        async function fetchWorldMapData() {
            if (worldMapPolygons) return worldMapPolygons;
            try {
                const topo = await fetchJsonWithRetry('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json', {
                    retries: 2,
                    timeoutMs: 15000
                });
                worldMapPolygons = decodeTopoJSON(topo);
                return worldMapPolygons;
            } catch (e) {
                console.error('Failed to fetch world map data:', e);
                return null;
            }
        }

        // Decode TopoJSON to arrays of [lon, lat] polygon rings
        function decodeTopoJSON(topo) {
            const { scale, translate } = topo.transform;
            // Decode arcs: delta-encoded integers → absolute lon/lat
            const arcs = topo.arcs.map(arc => {
                let x = 0, y = 0;
                return arc.map(([dx, dy]) => {
                    x += dx; y += dy;
                    return [x * scale[0] + translate[0], y * scale[1] + translate[1]];
                });
            });
            // Extract polygon rings from country geometries
            const countries = topo.objects.countries;
            const polygons = [];
            function extractGeometry(geom) {
                if (geom.type === 'GeometryCollection') {
                    geom.geometries.forEach(extractGeometry);
                } else if (geom.type === 'Polygon') {
                    geom.arcs.forEach(ring => polygons.push(resolveRing(ring)));
                } else if (geom.type === 'MultiPolygon') {
                    geom.arcs.forEach(poly => poly.forEach(ring => polygons.push(resolveRing(ring))));
                }
            }
            function resolveRing(ring) {
                const coords = [];
                ring.forEach(idx => {
                    const arc = idx < 0 ? [...arcs[~idx]].reverse() : arcs[idx];
                    arc.forEach((pt, i) => {
                        if (i > 0 || coords.length === 0) coords.push(pt);
                    });
                });
                return coords;
            }
            extractGeometry(countries);
            return polygons;
        }

        // Equirectangular projection: lon/lat → canvas x/y
        // Clipped to 83°N – 60°S (excludes Antarctica)
        const MAP_LAT_TOP = 83;
        const MAP_LAT_BOTTOM = -60;
        function projectGeo(lon, lat, mapBounds) {
            const x = mapBounds.left + ((lon + 180) / 360) * mapBounds.width;
            const y = mapBounds.top + ((MAP_LAT_TOP - lat) / (MAP_LAT_TOP - MAP_LAT_BOTTOM)) * mapBounds.height;
            return { x, y };
        }

        // Reverse projection: canvas x/y → lon/lat
        function unprojectGeo(x, y, mapBounds) {
            const lon = ((x - mapBounds.left) / mapBounds.width) * 360 - 180;
            const lat = MAP_LAT_TOP - ((y - mapBounds.top) / mapBounds.height) * (MAP_LAT_TOP - MAP_LAT_BOTTOM);
            return { lon, lat };
        }

        // Reverse geocode coordinates to get a place name and timezone
        async function reverseGeocode(lat, lon) {
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10&accept-language=en`;
                const data = await fetchJsonWithRetry(url, {
                    retries: 1,
                    timeoutMs: 12000,
                    headers: { 'Accept-Language': 'en' }
                });
                const name = data.address.city || data.address.town || data.address.village
                    || data.address.county || data.address.state || data.address.country || `${lat.toFixed(1)}°, ${lon.toFixed(1)}°`;
                return name;
            } catch (e) {
                return `${lat.toFixed(1)}°, ${lon.toFixed(1)}°`;
            }
        }

        // Draw heatmap overlay clipped to land masses
        function drawHeatmapOverlay(ctx, mapBounds, polygons, gridData) {
            // Build offscreen canvas with grid temperatures
            const offscreen = document.createElement('canvas');
            offscreen.width = HEATMAP_COLS;
            offscreen.height = HEATMAP_ROWS;
            const offCtx = offscreen.getContext('2d');
            const imgData = offCtx.createImageData(HEATMAP_COLS, HEATMAP_ROWS);

            for (let row = 0; row < HEATMAP_ROWS; row++) {
                for (let col = 0; col < HEATMAP_COLS; col++) {
                    const tempC = gridData[row][col];
                    const idx = ((HEATMAP_ROWS - 1 - row) * HEATMAP_COLS + col) * 4; // flip Y: row 0 is -60° (bottom)
                    if (tempC !== null) {
                        const color = getTempColor((tempC + 25) / 60);
                        imgData.data[idx] = Math.round(color.r);
                        imgData.data[idx + 1] = Math.round(color.g);
                        imgData.data[idx + 2] = Math.round(color.b);
                        imgData.data[idx + 3] = 140; // ~0.55 alpha
                    }
                    // null cells stay transparent (0,0,0,0)
                }
            }
            offCtx.putImageData(imgData, 0, 0);

            // Clip to land polygons
            ctx.save();
            ctx.beginPath();
            polygons.forEach(ring => {
                if (ring.length < 3) return;
                const allSouth = ring.every(pt => pt[1] < -60);
                if (allSouth) return;
                const first = projectGeo(ring[0][0], ring[0][1], mapBounds);
                ctx.moveTo(first.x, first.y);
                for (let i = 1; i < ring.length; i++) {
                    const p = projectGeo(ring[i][0], ring[i][1], mapBounds);
                    const lonJump = Math.abs(ring[i][0] - ring[i - 1][0]);
                    if (lonJump > 90) {
                        ctx.moveTo(p.x, p.y);
                    } else {
                        ctx.lineTo(p.x, p.y);
                    }
                }
            });
            ctx.clip();

            // Draw the tiny heatmap stretched to map bounds with bilinear smoothing
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Map the grid's lat/lon range to canvas pixel coordinates
            const topLeft = projectGeo(HEATMAP_LON_MIN - HEATMAP_STEP / 2, HEATMAP_LAT_MAX + HEATMAP_STEP / 2, mapBounds);
            const bottomRight = projectGeo(HEATMAP_LON_MAX + HEATMAP_STEP / 2, HEATMAP_LAT_MIN - HEATMAP_STEP / 2, mapBounds);
            ctx.drawImage(offscreen, topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);

            ctx.restore();
        }

        // Draw the world map with country outlines and city marker
        // Draw country outlines + extra dots (background layer, no main city dot)
        function drawWorldMapBackground(ctx, polygons, mapBounds, extraDots, heatmapGridData, heatmapAlpha) {
            // Draw heatmap underneath if active
            if (heatmapGridData && (heatmapAlpha === undefined || heatmapAlpha > 0.01)) {
                ctx.save();
                ctx.globalAlpha = heatmapAlpha !== undefined ? heatmapAlpha : 1;
                drawHeatmapOverlay(ctx, mapBounds, polygons, heatmapGridData);
                ctx.restore();
            }

            const hasHeatmap = heatmapGridData && (heatmapAlpha === undefined || heatmapAlpha > 0.01);
            ctx.strokeStyle = hasHeatmap ? 'rgba(100, 130, 180, 0.5)' : 'rgba(100, 130, 180, 0.3)';
            ctx.lineWidth = 0.5;
            polygons.forEach(ring => {
                if (ring.length < 3) return;
                const allSouth = ring.every(pt => pt[1] < -60);
                if (allSouth) return;
                ctx.beginPath();
                const first = projectGeo(ring[0][0], ring[0][1], mapBounds);
                ctx.moveTo(first.x, first.y);
                for (let i = 1; i < ring.length; i++) {
                    const p = projectGeo(ring[i][0], ring[i][1], mapBounds);
                    const lonJump = Math.abs(ring[i][0] - ring[i - 1][0]);
                    if (lonJump > 90) {
                        ctx.moveTo(p.x, p.y);
                    } else {
                        ctx.lineTo(p.x, p.y);
                    }
                }
                ctx.stroke();
            });
            if (extraDots && extraDots.length > 0) {
                extraDots.forEach(dot => {
                    const dp = projectGeo(dot.lon, dot.lat, mapBounds);
                    ctx.fillStyle = colorToString(dot.color, 0.7);
                    ctx.beginPath();
                    ctx.arc(dp.x, dp.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // Draw the main city dot at given coordinates
        function drawCityDot(ctx, lat, lon, mapBounds) {
            const pos = projectGeo(lon, lat, mapBounds);
            let dotColor = { r: 255, g: 200, b: 140 }; // fallback warm
            if (fullWeatherData && fullWeatherData.daylight && fullWeatherData.temperature) {
                let sum = 0, count = 0;
                for (let i = 0; i < 24; i++) {
                    if (fullWeatherData.daylight[i] > 0.5) {
                        sum += fullWeatherData.temperature[i];
                        count++;
                    }
                }
                if (count > 0) dotColor = getTempColor(sum / count);
            }
            ctx.fillStyle = colorToString(dotColor, 0.9);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw full world map (background + city dot)
        function drawWorldMap(ctx, polygons, cityLat, cityLon, mapBounds, extraDots, heatmapGridData, heatmapAlpha) {
            drawWorldMapBackground(ctx, polygons, mapBounds, extraDots, heatmapGridData, heatmapAlpha);
            drawCityDot(ctx, cityLat, cityLon, mapBounds);
        }

        // Animate dot from one position to another on the map
        let dotAnimationId = null;
        function animateDotTransition(canvas, fromLat, fromLon, toLat, toLon, duration, showHeatmap) {
            if (dotAnimationId) { cancelAnimationFrame(dotAnimationId); dotAnimationId = null; }
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const mapWidth = rect.width;
            const mapHeight = rect.height;

            // Draw background once and cache as ImageData
            ctx.setTransform(2, 0, 0, 2, 0, 0);
            ctx.clearRect(0, 0, mapWidth, mapHeight);
            drawWorldMapBackground(ctx, worldMapPolygons, currentMapBounds, currentExtraDots, showHeatmap ? currentHeatmapGrid : null);
            const baseImage = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const startTime = performance.now();
            function frame(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic

                const lat = fromLat + (toLat - fromLat) * eased;
                const lon = fromLon + (toLon - fromLon) * eased;

                // Restore background
                ctx.putImageData(baseImage, 0, 0);
                ctx.setTransform(2, 0, 0, 2, 0, 0);

                // Draw dot at interpolated position
                drawCityDot(ctx, lat, lon, currentMapBounds);

                if (t < 1) {
                    dotAnimationId = requestAnimationFrame(frame);
                } else {
                    dotAnimationId = null;
                }
            }
            dotAnimationId = requestAnimationFrame(frame);
        }

        // Show the world map below the UI
        async function showWorldMap(cityLat, cityLon) {
            // Cancel any existing fade timers
            if (mapFadeTimeout) { clearTimeout(mapFadeTimeout); mapFadeTimeout = null; }
            if (mapClearTimeout) { clearTimeout(mapClearTimeout); mapClearTimeout = null; }
            if (dotAnimationId) { cancelAnimationFrame(dotAnimationId); dotAnimationId = null; }
            cancelHeatmapFade();

            const canvas = document.getElementById('worldMapCanvas');
            const mapAlreadyVisible = canvas.classList.contains('visible') && currentMapBounds && currentMapLat !== null;

            // Save previous position for animation
            const prevLat = currentMapLat;
            const prevLon = currentMapLon;

            // Track current dot position for resize redraw
            currentMapLat = cityLat;
            currentMapLon = cityLon;

            // Fetch heatmap grid for current date (skip if already cached for this date)
            const city = cities[currentCity];
            const dateStr = getDateForOffset(city, currentDayOffset);
            const cachedHeatmap = getBoundedCacheEntry(heatmapGridCache, heatmapGridCacheOrder, dateStr);
            if (cachedHeatmap) {
                currentHeatmapGrid = cachedHeatmap;
            } else {
                const requestedDateStr = dateStr;
                fetchHeatmapGrid(requestedDateStr).then(grid => {
                    const latestDateStr = getDateForOffset(cities[currentCity], currentDayOffset);
                    if (latestDateStr !== requestedDateStr) return;
                    currentHeatmapGrid = grid;
                    // Redraw map with heatmap if still visible
                    if (canvas.classList.contains('visible') && currentMapBounds && worldMapPolygons) {
                        const ctx = canvas.getContext('2d');
                        const rect = canvas.getBoundingClientRect();
                        ctx.setTransform(2, 0, 0, 2, 0, 0);
                        ctx.clearRect(0, 0, rect.width, rect.height);
                        drawWorldMap(ctx, worldMapPolygons, currentMapLat, currentMapLon, currentMapBounds, currentExtraDots, currentHeatmapGrid);
                    }
                }).catch(e => console.error('Heatmap fetch failed:', e));
            }

            // If map is already visible, animate the dot (outlines only, no heatmap)
            if (mapAlreadyVisible) {
                cancelHeatmapFade();
                animateDotTransition(canvas, prevLat, prevLon, cityLat, cityLon, 800, false);
                showYearBand();
                scheduleMapFadeOut(canvas);
                return;
            }

            canvas.classList.remove('visible');

            // Fetch map data (cached after first load)
            const polygons = await fetchWorldMapData();
            if (!polygons) return;

            // Size the map to match the sky ribbon width, preserving aspect ratio
            const wrapper = document.getElementById('weatherDisplayWrapper');
            const skyRibbonEl = document.getElementById('skyRibbon');
            const wrapperRect = wrapper.getBoundingClientRect();
            const skyRect = skyRibbonEl.getBoundingClientRect();
            const mapWidth = skyRect.width;
            const padding = 15;
            // Correct aspect ratio: 360° longitude / 143° latitude (83°N to 60°S)
            const mapAspect = 360 / (MAP_LAT_TOP - MAP_LAT_BOTTOM);
            const innerWidth = mapWidth - padding * 2;
            const idealHeight = innerWidth / mapAspect + padding * 2;
            const maxHeight = wrapperRect.height || window.innerHeight * 0.5;
            const mapHeight = Math.min(idealHeight, maxHeight);

            // Size canvas (retina)
            canvas.width = mapWidth * 2;
            canvas.height = mapHeight * 2;
            canvas.style.width = mapWidth + 'px';
            canvas.style.height = mapHeight + 'px';

            // Fit map bounds within canvas while preserving aspect ratio
            const boundsHeight = mapHeight - padding * 2;
            const boundsWidth = boundsHeight * mapAspect;
            const boundsLeft = (mapWidth - boundsWidth) / 2;
            currentMapBounds = {
                left: boundsLeft,
                top: padding,
                width: boundsWidth,
                height: boundsHeight
            };

            // Draw once (static, no animation)
            const ctx = canvas.getContext('2d');
            ctx.setTransform(2, 0, 0, 2, 0, 0);
            drawWorldMap(ctx, polygons, cityLat, cityLon, currentMapBounds, currentExtraDots, currentHeatmapGrid);

            // Fade in
            canvas.style.pointerEvents = '';
            canvas.offsetHeight; // force reflow
            canvas.classList.add('visible');
            showYearBand();

            // After 8 seconds, fade out entire map
            scheduleMapFadeOut(canvas);
            // After 3 seconds, fade out heatmap colors (keep outlines)
            scheduleHeatmapFade(canvas);
        }

        // Schedule the map fade-out timer
        function scheduleMapFadeOut(canvas, delay = 8000) {
            if (mapFadeTimeout) clearTimeout(mapFadeTimeout);
            if (mapClearTimeout) clearTimeout(mapClearTimeout);
            mapFadeTimeout = setTimeout(() => {
                // Keep clickable during the 5s fade-out
                canvas.style.pointerEvents = 'auto';
                canvas.classList.remove('visible');
                // Clean up after the 5s fade-out transition completes
                mapClearTimeout = setTimeout(() => {
                    if (dotAnimationId) { cancelAnimationFrame(dotAnimationId); dotAnimationId = null; }
                    cancelHeatmapFade();
                    canvas.style.pointerEvents = '';
                    currentMapBounds = null;
                    currentMapLat = null;
                    currentMapLon = null;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    canvas.style.width = '0';
                    canvas.style.height = '0';
                    // Map fully gone — start year band fade
                    scheduleYearBandFadeOut();
                }, 5500);
            }, delay);
        }

        // Resize the map if it's currently visible
        function resizeWorldMap() {
            if (dotAnimationId) { cancelAnimationFrame(dotAnimationId); dotAnimationId = null; }
            const canvas = document.getElementById('worldMapCanvas');
            if (!canvas.classList.contains('visible') || currentMapLat === null || !worldMapPolygons) return;

            const wrapper = document.getElementById('weatherDisplayWrapper');
            const skyRibbonEl = document.getElementById('skyRibbon');
            const wrapperRect = wrapper.getBoundingClientRect();
            const skyRect = skyRibbonEl.getBoundingClientRect();
            const mapWidth = skyRect.width;
            const padding = 15;
            const mapAspect = 360 / (MAP_LAT_TOP - MAP_LAT_BOTTOM);
            const innerWidth = mapWidth - padding * 2;
            const idealHeight = innerWidth / mapAspect + padding * 2;
            const maxHeight = wrapperRect.height || window.innerHeight * 0.5;
            const mapHeight = Math.min(idealHeight, maxHeight);

            canvas.width = mapWidth * 2;
            canvas.height = mapHeight * 2;
            canvas.style.width = mapWidth + 'px';
            canvas.style.height = mapHeight + 'px';

            const boundsHeight = mapHeight - padding * 2;
            const boundsWidth = boundsHeight * mapAspect;
            const boundsLeft = (mapWidth - boundsWidth) / 2;
            currentMapBounds = {
                left: boundsLeft,
                top: padding,
                width: boundsWidth,
                height: boundsHeight
            };

            const ctx = canvas.getContext('2d');
            ctx.setTransform(2, 0, 0, 2, 0, 0);
            drawWorldMap(ctx, worldMapPolygons, currentMapLat, currentMapLon, currentMapBounds, currentExtraDots, currentHeatmapGrid);
        }

        // Click on the map to select a location
        document.getElementById('worldMapCanvas').addEventListener('click', async (e) => {
            if (!currentMapBounds || !worldMapPolygons) return;

            const canvas = e.currentTarget;
            const rect = canvas.getBoundingClientRect();
            // CSS pixel coordinates (mapBounds uses CSS pixels, not retina)
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const { lon, lat } = unprojectGeo(x, y, currentMapBounds);

            // Clamp to valid range
            if (lat < MAP_LAT_BOTTOM || lat > MAP_LAT_TOP || lon < -180 || lon > 180) return;

            // Track new dot position for resize redraw
            currentMapLat = lat;
            currentMapLon = lon;

            // Immediately redraw map with new dot position
            const mapWidth = rect.width;
            const mapHeight = rect.height;
            const ctx = canvas.getContext('2d');
            ctx.setTransform(2, 0, 0, 2, 0, 0);
            ctx.clearRect(0, 0, mapWidth, mapHeight);
            currentExtraDots = null; // Clear similar-city dots on new location pick
            drawWorldMap(ctx, worldMapPolygons, lat, lon, currentMapBounds, null, currentHeatmapGrid);

            // Restore full visibility (in case we're mid-fade) and reset timer
            canvas.classList.add('visible');
            scheduleMapFadeOut(canvas, 15000);

            // Get place name via reverse geocoding (async, don't block UI)
            const roundedLat = Math.round(lat * 100) / 100;
            const roundedLon = Math.round(lon * 100) / 100;
            const name = await reverseGeocode(roundedLat, roundedLon);

            // Create a new city entry with auto timezone
            const cityKey = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now();
            addOrUpdateCity(cityKey, {
                name: name,
                lat: roundedLat,
                lon: roundedLon,
                timezone: 'auto'
            });
            currentCity = cityKey;
            currentDayOffset = 0;

            // Update weather display (skip temp range recalc now; recalcs on day change)
            await refreshView(true);
            showYearBand();
            prefetchRemainingDays(cityKey);
        });

        // Cache for fetched weather data (keyed by city-dateStr)
        // Each entry: { data: weatherData, fetchedAt: timestamp }
        const weatherCache = {};
        const weatherCacheOrder = [];
        const CACHE_MAX_AGE = 60 * 60 * 1000; // 1 hour in ms

        // Year band data cache (keyed by cityKey)
        const yearBandCache = {};
        const yearBandCacheOrder = [];
        let yearBandCity = null; // Track which city the current band is for

        // Load saved default city from localStorage
        function loadDefaultCity() {
            try {
                const saved = localStorage.getItem('weatherFlow_defaultCity');
                if (saved) {
                    const cityData = JSON.parse(saved);
                    // Add to cities if not a built-in city
                    if (!cities[cityData.key]) {
                        addOrUpdateCity(cityData.key, cityData.data);
                    }
                    return cityData.key;
                }
            } catch (e) {
                console.log('Could not load saved city:', e);
            }
            return 'baltimore';
        }

        function saveDefaultCity(cityKey) {
            try {
                const cityData = {
                    key: cityKey,
                    data: cities[cityKey]
                };
                localStorage.setItem('weatherFlow_defaultCity', JSON.stringify(cityData));
            } catch (e) {
                console.log('Could not save default city:', e);
            }
        }

        // Temperature unit (persisted)
        let useFahrenheit = localStorage.getItem('useFahrenheit') === 'true';
        function displayTemp(celsius) {
            return useFahrenheit ? Math.round(celsius * 9/5 + 32) : Math.round(celsius);
        }
        function tempUnit() { return useFahrenheit ? '°F' : '°C'; }

        // Current state
        let currentCity = null;
        currentCity = loadDefaultCity();
        let currentDayOffset = 0; // 0 = today, positive = future, negative = past
        const maxFutureOffset = 14; // Today + 14 days ahead (API limit)
        const historyBatchSize = 7; // Days to prefetch when going back in time
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

        // Current weather data
        let fullWeatherData = null;
        let weatherData = {};

        // Helper to get date string for a given offset from today in city's timezone
        function getDateForOffset(city, dayOffset) {
            const tz = getCityTimeZone(city);
            const cityTodayStr = formatDateInTimeZone(new Date(), tz);
            return shiftDateString(cityTodayStr, dayOffset);
        }

        // Fetch weather data from Open-Meteo API (forecast or historical)
        async function fetchWeatherData(cityKey, dayOffset = 0, options = {}) {
            const { signal } = options;
            const city = cities[cityKey];
            const dateStr = getDateForOffset(city, dayOffset);

            // Cache key uses the actual date to ensure correct data
            const cacheKey = `${cityKey}-${dateStr}`;

            // Return cached data if available, complete, and less than 1 hour old
            const cached = getBoundedCacheEntry(weatherCache, weatherCacheOrder, cacheKey);
            if (cached && cached.data && cached.data.precipMm && cached.data.snowCm &&
                (Date.now() - cached.fetchedAt) < CACHE_MAX_AGE) {
                return cached.data;
            }
            if (cached && (Date.now() - cached.fetchedAt) >= CACHE_MAX_AGE) {
                removeBoundedCacheEntry(weatherCache, weatherCacheOrder, cacheKey);
            }

            // Use historical API for past dates (more than 5 days ago), forecast API otherwise
            // Historical API has ~5 day delay, so use forecast for recent past
            const isHistorical = dayOffset < -5;
            const baseUrl = isHistorical
                ? 'https://archive-api.open-meteo.com/v1/archive'
                : 'https://api.open-meteo.com/v1/forecast';

            // Historical API doesn't have precipitation_probability
            const hourlyParams = isHistorical
                ? 'temperature_2m,cloud_cover,rain,snowfall,precipitation,wind_speed_10m,wind_direction_10m'
                : 'temperature_2m,cloud_cover,rain,snowfall,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m,is_day';

            // Request 2 days so temperature spline can look ahead past hour 23
            const nextDateStr = getDateForOffset(city, dayOffset + 1);
            const apiTz = city.timezone === 'auto' ? 'auto' : getCityTimeZone(city);
            const url = `${baseUrl}?latitude=${city.lat}&longitude=${city.lon}&hourly=${hourlyParams}&daily=sunrise,sunset&timezone=${encodeURIComponent(apiTz)}&start_date=${dateStr}&end_date=${nextDateStr}`;

            try {
                const data = await fetchJsonWithRetry(url, {
                    retries: 1,
                    timeoutMs: 15000,
                    signal
                });

                // Check for API error response (e.g. rate limit)
                if (data.error || !data.hourly) {
                    throw new Error(data.reason || 'Invalid API response');
                }

                // Resolve 'auto' timezone from API response (e.g. map-click cities)
                if (city.timezone === 'auto' && data.timezone) {
                    city.timezone = data.timezone;
                }

                // Parse sunrise/sunset times to hours
                let sunriseHour, sunsetHour;
                if (data.daily && data.daily.sunrise && data.daily.sunset) {
                    const sunriseTime = new Date(data.daily.sunrise[0]);
                    const sunsetTime = new Date(data.daily.sunset[0]);
                    sunriseHour = sunriseTime.getHours() + sunriseTime.getMinutes() / 60;
                    sunsetHour = sunsetTime.getHours() + sunsetTime.getMinutes() / 60;
                } else {
                    // Derive from is_day hourly field (first 24 hours only)
                    const isDay = data.hourly && data.hourly.is_day ? data.hourly.is_day.slice(0, 24) : null;
                    if (isDay) {
                        sunriseHour = 6; sunsetHour = 18; // defaults
                        for (let i = 1; i < isDay.length; i++) {
                            if (isDay[i] === 1 && isDay[i - 1] === 0) { sunriseHour = i - 0.5; break; }
                        }
                        for (let i = isDay.length - 1; i > 0; i--) {
                            if (isDay[i] === 0 && isDay[i - 1] === 1) { sunsetHour = i - 0.5; break; }
                        }
                    } else {
                        sunriseHour = 6; sunsetHour = 18;
                    }
                }

                // Generate daylight array based on sunrise/sunset using smooth cosine curve
                // This creates a natural bell curve for daylight intensity
                const daylight = [];
                const transitionDuration = 1.2; // hours for dawn/dusk transition
                for (let hour = 0; hour < 24; hour++) {
                    let value;
                    if (hour < sunriseHour - transitionDuration) {
                        // Full night before dawn
                        value = 0;
                    } else if (hour < sunriseHour + transitionDuration) {
                        // Dawn transition - smooth cosine curve from 0 to 1
                        const t = (hour - (sunriseHour - transitionDuration)) / (2 * transitionDuration);
                        value = 0.5 - 0.5 * Math.cos(t * Math.PI);
                    } else if (hour < sunsetHour - transitionDuration) {
                        // Full day
                        value = 1;
                    } else if (hour < sunsetHour + transitionDuration) {
                        // Dusk transition - smooth cosine curve from 1 to 0
                        const t = (hour - (sunsetHour - transitionDuration)) / (2 * transitionDuration);
                        value = 0.5 + 0.5 * Math.cos(t * Math.PI);
                    } else {
                        // Full night after dusk
                        value = 0;
                    }
                    daylight.push(value);
                }

                // Slice all arrays to 24 hours (API may return 48 due to 2-day fetch)
                const h24 = arr => arr.slice(0, 24);

                // Normalize cloud cover (0-100 -> 0-1)
                const clouds = h24(data.hourly.cloud_cover.map(c => c / 100));

                // Use precipitation field as primary source (works for all forecast days)
                // precipitation = total water equivalent in mm (rain + melted snow)
                // Fall back to rain field if precipitation is not available
                const precipMm = h24(data.hourly.precipitation || data.hourly.rain);

                // Normalize precipitation for visual rendering (mm -> 0-1, capped at 10mm = 1)
                // Use precipitation field instead of rain for consistent display across all days
                const rain = precipMm.map(p => Math.min(1, p / 10));

                // Normalize snowfall (cm -> 0-1, capped at 5cm = 1)
                const snowfallAll = data.hourly.snowfall.map(s => Math.min(1, s / 5));
                const snowfall = h24(snowfallAll);
                const hasSnow = snowfall.some(s => s > 0);
                // Keep raw snow values (cm) for display
                const snowCm = h24(data.hourly.snowfall);

                // Normalize temperature (-25°C to 50°C+ -> 0 to 1.25)
                // Keep all hours (may be 48 if 2-day fetch) for spline lookahead
                const temperatureAll = data.hourly.temperature_2m.map(t => {
                    return Math.max(0, (t + 25) / 60);
                });
                const temperature = temperatureAll.slice(0, 24);

                // Get precipitation probability (0-100%) - keep hourly array
                const precipProbability = h24(data.hourly.precipitation_probability || new Array(48).fill(0));

                // Wind speed (km/h) - normalize to 0-1 (0 = calm, 1 = 80+ km/h strong wind)
                const windSpeedRaw = h24(data.hourly.wind_speed_10m || new Array(48).fill(0));
                const windSpeed = windSpeedRaw.map(w => Math.min(1, w / 80));
                // Wind direction (degrees, 0 = North, 90 = East, etc.)
                const windDirection = h24(data.hourly.wind_direction_10m || new Array(48).fill(0));

                const weatherData = {
                    daylight,
                    clouds,
                    rain,
                    precipMm,
                    snow: hasSnow ? snowfall : null,
                    snowCm,
                    temperature,
                    temperatureExtended: temperatureAll, // 24-48 hours for spline lookahead
                    precipProbability,
                    windSpeed,
                    windSpeedRaw,
                    windDirection,
                    sunriseHour,
                    sunsetHour
                };

                // Cache the result with timestamp
                setBoundedCacheEntry(
                    weatherCache,
                    weatherCacheOrder,
                    cacheKey,
                    { data: weatherData, fetchedAt: Date.now() },
                    MAX_WEATHER_CACHE_ENTRIES
                );
                return weatherData;

            } catch (error) {
                if (isAbortError(error)) throw error;
                console.error('Failed to fetch weather data:', error);
                const z = new Array(24).fill(0);
                return {
                    daylight: [0,0,0,0,0,0,0.1,0.4,0.7,0.9,1,1,1,1,1,1,0.9,0.5,0.1,0,0,0,0,0],
                    clouds: new Array(24).fill(0.3), rain: z, precipMm: z,
                    snow: null, snowCm: z, temperature: new Array(24).fill(0.5),
                    precipProbability: z, windSpeed: z, windSpeedRaw: z, windDirection: z,
                    sunriseHour: 6, sunsetHour: 18
                };
            }
        }

        // Find sunrise and sunset hours from daylight data
        function findSunriseSunset(daylightData) {
            let sunrise = 0, sunset = 23;
            for (let i = 0; i < daylightData.length; i++) {
                if (daylightData[i] > 0) {
                    sunrise = i;
                    break;
                }
            }
            for (let i = daylightData.length - 1; i >= 0; i--) {
                if (daylightData[i] > 0) {
                    sunset = i;
                    break;
                }
            }
            return { sunrise, sunset };
        }

        // Get display range: 2h before sunrise to 2h after sunset
        function getDisplayRange(data) {
            const { sunrise, sunset } = findSunriseSunset(data.daylight);
            const startHour = Math.max(0, sunrise - 2);
            const endHour = Math.min(23, sunset + 2);
            return { startHour, endHour };
        }

        function sliceWeatherData(data, startHour, endHour) {
            return data.slice(startHour, endHour + 1);
        }

        // Store display range for proper interpolation mapping
        let displayStartHour = 0;
        let displayEndHour = 23;

        // Store temperature display range (mean ± 10°C) for current location
        // These are normalized values (0-1 representing -25°C to +35°C)
        let tempDisplayMin = 0;  // Will be updated when location changes
        let tempDisplayMax = 1;  // Will be updated when location changes
        let tempRangeCity = null; // Track which city the temp range was calculated for
        let tempRangeBaseOffset = 0; // Track which day offset the temp range was calculated for

        // Guard against stale async refreshes
        let refreshRequestToken = 0;
        let activeRefreshController = null;

        // Map a normalized temperature (0-1) to display Y position fraction
        // Returns 0 at tempDisplayMin and 1 at tempDisplayMax
        function mapTempToDisplayRange(tempValue) {
            if (tempDisplayMax === tempDisplayMin) return 0.5;
            return (tempValue - tempDisplayMin) / (tempDisplayMax - tempDisplayMin);
        }

        // Calculate mean temperature across sample days for a location
        // baseOffset: the day offset to center the calculation around (0 for today, -30 for 30 days ago, etc.)
        async function calculateLocationTempRange(cityKey, baseOffset = 0, options = {}) {
            const { signal, refreshToken = null } = options;
            let totalTemp = 0;
            let count = 0;

            // Fetch temperature data for baseOffset and baseOffset + maxFutureOffset (or just baseOffset for historical)
            const sampleDays = baseOffset >= 0
                ? [baseOffset, baseOffset + maxFutureOffset]
                : [baseOffset, baseOffset + 14]; // For historical, sample 2 weeks ahead from base

            for (const day of sampleDays) {
                if (refreshToken !== null && refreshToken !== refreshRequestToken) return false;
                try {
                    const dayData = await fetchWeatherData(cityKey, day, { signal });
                    if (dayData && dayData.temperature) {
                        // Sum all hourly temperatures
                        for (const temp of dayData.temperature) {
                            totalTemp += temp;
                            count++;
                        }
                    }
                } catch (e) {
                    if (isAbortError(e)) throw e;
                    // Skip days that fail to fetch
                    console.log(`Skipped day ${day} for temp range calculation`);
                }
            }

            if (count > 0) {
                if (refreshToken !== null && refreshToken !== refreshRequestToken) return false;
                const meanTemp = totalTemp / count;
                // Mean - 10°C to Mean + 22.5°C (asymmetric range)
                // In normalized space: 10°C = 10/60, 22.5°C = 22.5/60
                const rangeBelow = 10 / 60;
                const rangeAbove = 22.5 / 60;
                tempDisplayMin = Math.max(0, meanTemp - rangeBelow);
                tempDisplayMax = Math.min(1, meanTemp + rangeAbove);
                tempRangeBaseOffset = baseOffset;
                console.log(`Temp range for ${cityKey} (offset ${baseOffset}): mean=${((meanTemp * 60) - 25).toFixed(1)}°C, display range: ${((tempDisplayMin * 60) - 25).toFixed(1)}°C to ${((tempDisplayMax * 60) - 25).toFixed(1)}°C`);
                return true;
            }
            return false;
        }

        // Check if temp range needs recalculation based on day offset
        function needsTempRangeRecalc(dayOffset) {
            // Recalculate every 30 days when going back in time
            const currentBucket = Math.floor(dayOffset / 30) * 30;
            const rangeBucket = Math.floor(tempRangeBaseOffset / 30) * 30;
            return currentBucket !== rangeBucket;
        }

        // Quick temp range from a single day's data (no API calls, synchronous)
        function calculateTempRangeFromData(dayData) {
            if (!dayData || !dayData.temperature) return;
            let totalTemp = 0;
            for (const temp of dayData.temperature) {
                totalTemp += temp;
            }
            const meanTemp = totalTemp / dayData.temperature.length;
            const rangeBelow = 10 / 60;
            const rangeAbove = 22.5 / 60;
            tempDisplayMin = Math.max(0, meanTemp - rangeBelow);
            tempDisplayMax = Math.min(1, meanTemp + rangeAbove);
            tempRangeBaseOffset = 0;
        }

        // Refine temp range in background using today + day+14 data
        async function refineTempRangeInBackground(cityKey) {
            try {
                const futureData = await fetchWeatherData(cityKey, maxFutureOffset);
                const todayData = await fetchWeatherData(cityKey, 0); // cache hit
                if (!futureData?.temperature || !todayData?.temperature) return;

                let totalTemp = 0, count = 0;
                for (const t of todayData.temperature) { totalTemp += t; count++; }
                for (const t of futureData.temperature) { totalTemp += t; count++; }

                const meanTemp = totalTemp / count;
                const newMin = Math.max(0, meanTemp - 10 / 60);
                const newMax = Math.min(1, meanTemp + 22.5 / 60);

                if (cityKey !== currentCity) return;
                if (Math.abs(newMin - tempDisplayMin) > 0.01 || Math.abs(newMax - tempDisplayMax) > 0.01) {
                    tempDisplayMin = newMin;
                    tempDisplayMax = newMax;
                    draw();
                }
            } catch (e) {
                // Initial range from today's data is good enough
            }
        }

        async function updateWeatherData(cityKey, dayOffset = 0, options = {}) {
            const { signal, refreshToken = null } = options;
            const nextFullWeatherData = await fetchWeatherData(cityKey, dayOffset, { signal });
            if (refreshToken !== null && refreshToken !== refreshRequestToken) return false;

            const { startHour, endHour } = getDisplayRange(nextFullWeatherData);
            const nextWeatherData = {
                daylight: sliceWeatherData(nextFullWeatherData.daylight, startHour, endHour),
                clouds: sliceWeatherData(nextFullWeatherData.clouds, startHour, endHour),
                rain: sliceWeatherData(nextFullWeatherData.rain, startHour, endHour),
                precipMm: sliceWeatherData(nextFullWeatherData.precipMm, startHour, endHour),
                precipProbability: sliceWeatherData(nextFullWeatherData.precipProbability, startHour, endHour),
                snow: nextFullWeatherData.snow ? sliceWeatherData(nextFullWeatherData.snow, startHour, endHour) : null,
                snowCm: sliceWeatherData(nextFullWeatherData.snowCm, startHour, endHour),
                // Keep extended temperature data (24-48h) for proper Catmull-Rom interpolation at edges
                temperatureFull: nextFullWeatherData.temperatureExtended || nextFullWeatherData.temperature,
                temperature: sliceWeatherData(nextFullWeatherData.temperature, startHour, endHour),
                windSpeed: sliceWeatherData(nextFullWeatherData.windSpeed, startHour, endHour),
                windSpeedRaw: sliceWeatherData(nextFullWeatherData.windSpeedRaw, startHour, endHour),
